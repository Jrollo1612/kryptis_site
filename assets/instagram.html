<svg width="150" height="150" viewBox="0 0 150 150">
    <!-- Rectangle externe : dégradé jaune-rouge -->
    <rect x="20%" y="10%" width="80%" height="80%"
          rx="40"
          ry="40"
          fill="url(#gradient)" />

    <!-- Cercle intérieur (centré, blanc ou transparent) -->
    <circle cx="50%" cy="50%" r="25%" 
            fill="white"/>

    <!-- Dégradé jaune-rouge -->
    <defs>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD700"/>  <!-- Jaune clair -->
            <stop offset="30%" stop-color="#FF4500"/> <!-- Orange-rouge -->
            <stop offset="50%" stop-color="red"/> <!-- Rouge foncé -->
            <stop offset="100%" stop-color="#FFD700"/>  <!-- Jaune clair -->
            <stop offset="70%" stop-color="#FF4500"/> <!-- Orange-rouge -->
        </linearGradient>
    </defs>

</svg>
