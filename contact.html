<body>
    <header class="header">
        <nav aria-label="Language selector"  >
            <label for="languageSelect" class="visually-hidden" >Select language</label>
            <select id="languageSelect">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="it">Italiano</option>
                <option value="de">Deutsch</option>
            </select>
        </nav>
        <div class="logo">
            <img src="assets/kryptis_logo.s vg" alt="Kryptis Logo" id="logo">
            <p  id="nom">Kryptis</p>
        </div>
        <h1 >Kryptis - Contact us</h1>
        <nav aria-label="Main navigation"  >
            <ul class="main-nav">
                <li><a href="/index.html" >Home</a></li>
                <li><a href="/trad.html" >Online Translator</a></li>
                <li><a href="/download.html" >Download</a></li>
                <li><a href="/reviews.html" >Reviews</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <section class="reviews-section" aria-labelledby="contact-form-title">
            <h2 id="contact-form-title" >Contact us</h2>
            <form id="contactForm" class="review-form" netlify>
                <label for="name" >Name</label>
                <input type="text" id="name" name="name" maxlength="40" required>

                <label for="email" >Email</label>
                <input type="email" id="email" name="email" maxlength="100" required>

                <label for="message" >Message</label>
                <textarea id="message" name="reviewMessage" rows="5" maxlength="400" required></textarea>

                <div class="review-actions">
                    <button type="submit" class="download-button" >Submit review</button>
                </div>
                <p id="reviewStatus" class="notice" aria-live="polite"></p>
            </form>
        </section>

        <p><a href="/download.html" >Back to download page</a></p>
    </main>
    <button id="contact_form" onmouseover="form.mousover()" onclick="form.click()"></button>
